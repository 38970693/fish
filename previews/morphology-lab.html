<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鱼类形态实验室</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#061725;color:#e9f8ff;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:1420px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{margin:5px 0;font-size:30px}.muted{color:#8fb1c5}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:22px}.panel,.stage{background:#0b2333;border:1px solid #21485b;border-radius:18px;padding:18px}.controls{max-height:760px;overflow:auto}.row{display:grid;grid-template-columns:135px 1fr 48px;gap:8px;align-items:center;margin:10px 0}.row label{font-size:13px;color:#b9d4df}.row output{text-align:right;color:#6ee7e0;font-variant-numeric:tabular-nums}.selectrow{display:grid;grid-template-columns:135px 1fr;gap:8px;margin:10px 0;align-items:center}select,input,button,textarea{background:#102f40;color:#e9f8ff;border:1px solid #326176;border-radius:8px;padding:7px}input[type=range]{width:100%;padding:0}.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}.view{background:radial-gradient(circle at 60% 35%,#174b60,#071a2b 70%);border-radius:14px;min-height:360px;position:relative;overflow:hidden}.view h3{position:absolute;z-index:2;margin:12px 14px;font-size:13px;color:#9ee9e4}.view canvas{width:100%;height:100%;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.debug{display:grid;grid-template-columns:1fr 1fr;gap:12px}.debug pre,.debug textarea{margin:0;min-height:150px;width:100%;white-space:pre-wrap;font-size:12px;overflow:auto}.warning{color:#fbbf24}.ok{color:#86efac}@media(max-width:900px){.layout{grid-template-columns:1fr}.views,.debug{grid-template-columns:1fr}.controls{max-height:none}}
  </style>
</head>
<body><main>
  <div class="head"><div><div class="muted">DEVELOPMENT TOOL / V3-03</div><h1>鱼类形态实验室</h1><div class="muted">同一份 ResolvedMorphology 驱动 Canvas 与 PixiJS</div></div><a href="/" style="color:#67e8f9">返回游戏</a></div>
  <div class="layout"><section class="panel controls" id="controls"></section><section class="stage">
    <div class="views"><div class="view"><h3>CANVAS</h3><canvas id="canvas"></canvas></div><div class="view" id="pixi"><h3>PIXIJS</h3></div></div>
    <div class="toolbar"><button id="reroll">重掷种子</button><button id="toggle-rare">切换普通小丑鱼</button><button id="toggle-pattern">关闭花纹</button><button id="toggle-volume">仅看体积</button><button id="toggle-motion">暂停游动</button><button id="toggle-rig">显示骨架</button><button id="toggle-mask">显示遮罩</button><button id="toggle-bounds">显示图元边界</button><button id="lod">LOD 0</button><button id="export">导出 JSON</button><button id="import">导入 JSON</button></div>
    <div class="debug"><pre id="diagnostics"></pre><textarea id="json" spellcheck="false" aria-label="FishAppearanceV2 JSON"></textarea></div>
  </section></div>
</main><script type="module" src="/src/morphology/MorphologyLab.ts"></script></body></html>
